services:
  - type: web
    name: maintenancehub-web
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: maintenancehub-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: maintenancehub-redis
          type: redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: maintenancehub.onrender.com
      - key: DEBUG
        value: "false"
    healthCheckPath: /health/

  - type: worker
    name: maintenancehub-celery
    env: python
    plan: starter
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A config.celery_app worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: maintenancehub-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: maintenancehub-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: maintenancehub-redis
          type: redis
          property: connectionString

  - type: worker
    name: maintenancehub-beat
    env: python
    plan: starter
    buildCommand: pip install -r requirements/production.txt
    startCommand: celery -A config.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: maintenancehub-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: maintenancehub-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: maintenancehub-redis
          type: redis
          property: connectionString

databases:
  - name: maintenancehub-db
    region: oregon
    plan: starter

  - name: maintenancehub-redis
    type: redis
    region: oregon
    plan: starter
