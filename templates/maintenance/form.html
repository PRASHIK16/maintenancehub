{% extends "layout/app.html" %}
{% load static %}

{% block title %}{{ action }} Maintenance Schedule{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-content">
    <nav class="breadcrumb mb-1">
      <a href="{% url 'maintenance:list' %}" class="breadcrumb-link">Maintenance</a>
      <span class="breadcrumb-sep">›</span>
      <span>{{ action }}</span>
    </nav>
    <h1 class="page-title">{{ action }} Maintenance Schedule</h1>
  </div>
</div>

<div class="max-w-2xl">
  <div class="card">
    <div class="card-body">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label required">Title</label>
          <input type="text" name="title" class="form-input" placeholder="e.g. Monthly AC Filter Cleaning" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" rows="2" class="form-textarea"
                    placeholder="What needs to be done?"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Asset</label>
            <select name="asset" class="form-select">
              <option value="">— No specific asset —</option>
              {% for asset in assets %}
              <option value="{{ asset.pk }}">{{ asset.name }} ({{ asset.asset_code }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Location</label>
            <select name="location" class="form-select">
              <option value="">— No specific location —</option>
              {% for loc in locations %}
              <option value="{{ loc.pk }}">{{ loc.full_path }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label required">Frequency</label>
            <select name="frequency" class="form-select">
              {% for val, label in frequency_choices %}
              <option value="{{ val }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Custom Interval (days)</label>
            <input type="number" name="interval_days" class="form-input" min="1"
                   placeholder="Only for 'Custom' frequency">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Assigned Team</label>
            <select name="assigned_team" class="form-select">
              <option value="">— Unassigned —</option>
              {% for team in teams %}
              <option value="{{ team.pk }}">{{ team.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Next Due Date</label>
            <input type="datetime-local" name="next_due_at" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Estimated Duration (hours)</label>
          <input type="number" name="estimated_duration_hours" class="form-input"
                 min="0.5" max="100" step="0.5" placeholder="e.g. 2.5">
        </div>

        <div class="form-group">
          <label class="form-label">Checklist Items</label>
          <textarea name="checklist" rows="5" class="form-textarea font-mono text-sm"
                    placeholder="One item per line:&#10;Check air filters&#10;Inspect belts&#10;Clean coils"></textarea>
          <p class="form-help">Enter one checklist item per line.</p>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn btn-primary">{{ action }} Schedule</button>
          <a href="{% url 'maintenance:list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
