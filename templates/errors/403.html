{% extends "base.html" %}

{% block title %}Access Denied — MaintenanceHub{% endblock %}

{% block body %}
<div class="error-page">
  <div class="error-page-inner">
    <div class="error-code">403</div>
    <div class="flex items-center justify-center w-16 h-16 rounded-2xl mx-auto mb-6"
         style="background-color: #fee2e2;">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="color: #dc2626;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 class="error-title">Access denied</h1>
    <p class="error-desc">You don't have permission to view this page. Contact your administrator if you believe this is an error.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
    </div>
  </div>
</div>
{% endblock %}
