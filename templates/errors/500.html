{% extends "base.html" %}

{% block title %}Server Error — MaintenanceHub{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="text-center max-w-sm">
    <div class="text-8xl font-800 text-[var(--text-tertiary)] opacity-20 select-none mb-4">500</div>
    <div class="w-16 h-16 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-700 text-[var(--text-primary)] mb-2">Something went wrong</h1>
    <p class="text-[var(--text-secondary)] mb-8">
      An unexpected error occurred. Our team has been notified. Please try again in a moment.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      <button onclick="location.reload()" class="btn btn-secondary">Try Again</button>
    </div>
  </div>
</div>
{% endblock %}
