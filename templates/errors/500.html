{% extends "base.html" %}

{% block title %}Server Error — MaintenanceHub{% endblock %}

{% block body %}
<div class="error-page">
  <div class="error-page-inner">
    <div class="error-code">500</div>
    <div class="flex items-center justify-center w-16 h-16 rounded-2xl mx-auto mb-6"
         style="background-color: #fffbeb; border: 1px solid #fde68a;">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="color: #d97706;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-desc">An unexpected error occurred. Our team has been notified. Please try again in a moment.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      <button onclick="location.reload()" class="btn btn-secondary">Try Again</button>
    </div>
  </div>
</div>
{% endblock %}
