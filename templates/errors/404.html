{% extends "base.html" %}

{% block title %}Page Not Found — MaintenanceHub{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="text-center max-w-sm">
    <div class="text-8xl font-800 text-[var(--text-tertiary)] opacity-20 select-none mb-4">404</div>
    <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-700 text-[var(--text-primary)] mb-2">Page not found</h1>
    <p class="text-[var(--text-secondary)] mb-8">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      <button onclick="history.back()" class="btn btn-secondary">Go Back</button>
    </div>
  </div>
</div>
{% endblock %}
