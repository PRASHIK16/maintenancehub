<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MaintenanceHub{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #FFFFFF; border-radius: 12px; border: 1px solid #E2E8F0; overflow: hidden; }
    .header { background-color: #059669; padding: 24px 32px; }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-text { font-size: 16px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em; }
    .body { padding: 32px; }
    h1 { font-size: 20px; font-weight: 700; color: #0F172A; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.7; color: #475569; margin: 0 0 16px; }
    .ticket-card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px 20px; margin: 20px 0; }
    .ticket-card .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #94A3B8; margin: 0 0 4px; }
    .ticket-card .value { font-size: 14px; font-weight: 600; color: #0F172A; margin: 0 0 12px; }
    .btn { display: inline-block; background-color: #059669; color: #FFFFFF !important; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; margin: 8px 0 24px; }
    .footer { padding: 20px 32px; border-top: 1px solid #E2E8F0; background-color: #F8FAFC; }
    .footer p { font-size: 12px; color: #94A3B8; margin: 0; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <span class="logo-text">⚙ MaintenanceHub</span>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>You received this email because you have notifications enabled on MaintenanceHub.<br>
      © {% now "Y" %} MaintenanceHub. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
