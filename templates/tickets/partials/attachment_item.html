{% load humanize %}
{# Rendered and injected by HTMX after attachment upload #}
<a href="{{ attachment.file.url }}" target="_blank"
   class="flex flex-col items-center gap-2 p-3 rounded-xl transition-colors group"
   style="border: 1px solid var(--border-subtle); text-decoration: none; display: flex;">
  {% if attachment.is_image %}
  <img src="{{ attachment.file.url }}" alt="{{ attachment.original_filename }}"
       class="w-full h-20 object-cover rounded-lg">
  {% else %}
  <div class="w-10 h-10 rounded-lg flex items-center justify-center"
       style="background-color: var(--bg-subtle);">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
         style="color: var(--text-muted);">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
  </div>
  {% endif %}
  <span class="text-xs truncate w-full text-center" style="color: var(--text-secondary);">
    {{ attachment.original_filename }}
  </span>
  <span class="text-xs" style="color: var(--text-muted);">{{ attachment.file_size_display }}</span>
</a>
