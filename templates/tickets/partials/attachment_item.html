{% load humanize %}
{# Rendered and injected by HTMX after attachment upload #}
<a href="{{ attachment.file.url }}" target="_blank"
   class="flex flex-col items-center gap-2 p-3 border border-[var(--surface-border)] rounded-xl hover:border-indigo-300 hover:bg-indigo-50 transition-colors group">
  {% if attachment.is_image %}
  <img src="{{ attachment.file.url }}" alt="{{ attachment.original_filename }}"
       class="w-full h-20 object-cover rounded-lg">
  {% else %}
  <div class="w-10 h-10 bg-[var(--surface-secondary)] rounded-lg flex items-center justify-center">
    <svg class="w-5 h-5 text-[var(--text-tertiary)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
  </div>
  {% endif %}
  <span class="text-xs text-[var(--text-secondary)] truncate w-full text-center group-hover:text-indigo-600">
    {{ attachment.original_filename }}
  </span>
  <span class="text-xs text-[var(--text-tertiary)]">{{ attachment.file_size_display }}</span>
</a>
