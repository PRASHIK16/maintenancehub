{% load humanize %}
{# Rendered and injected by HTMX after a comment POST #}
<div id="comment-{{ comment.pk }}"
     class="flex gap-3"
     {% if comment.is_internal %}style="background-color: #f5f3ff; border: 1px solid #ede9fe; border-radius: 12px; padding: 12px;"{% endif %}>
  <div class="avatar-emerald flex-shrink-0" style="width: 32px; height: 32px; font-size: 12px;">
    {{ comment.author.initials }}
  </div>
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-sm font-semibold" style="color: var(--text-primary);">{{ comment.author.display_name }}</span>
      {% if comment.is_internal %}
      <span class="text-xs px-1.5 py-0.5 rounded font-medium"
            style="background-color: #ede9fe; color: #6d28d9;">Internal Note</span>
      {% endif %}
      <span class="text-xs" style="color: var(--text-muted);">just now</span>
    </div>
    <p class="text-sm mt-1 leading-relaxed whitespace-pre-wrap" style="color: var(--text-primary);">{{ comment.body }}</p>
  </div>
</div>
