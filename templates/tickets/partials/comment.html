{% load humanize %}
{# Rendered and injected by HTMX after a comment POST #}
<div id="comment-{{ comment.pk }}"
     class="flex gap-3 {% if comment.is_internal %}bg-violet-50 border border-violet-100 rounded-xl p-3{% endif %}">
  <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-sm font-700 text-indigo-700 flex-shrink-0">
    {{ comment.author.initials }}
  </div>
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-sm font-600 text-[var(--text-primary)]">{{ comment.author.display_name }}</span>
      {% if comment.is_internal %}
      <span class="text-xs bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded font-500">Internal Note</span>
      {% endif %}
      <span class="text-xs text-[var(--text-tertiary)]">just now</span>
    </div>
    <p class="text-sm text-[var(--text-primary)] mt-1 leading-relaxed whitespace-pre-wrap">{{ comment.body }}</p>
  </div>
</div>
