{% extends "base.html" %}
{% load static %}

{% block title %}{{ action }} Asset{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-content">
    <nav class="breadcrumb mb-1">
      <a href="{% url 'assets:list' %}" class="breadcrumb-link">Assets</a>
      <span class="breadcrumb-sep">›</span>
      {% if asset %}<a href="{% url 'assets:detail' asset.pk %}" class="breadcrumb-link">{{ asset.name }}</a>
      <span class="breadcrumb-sep">›</span>{% endif %}
      <span>{{ action }}</span>
    </nav>
    <h1 class="page-title">{{ action }} Asset</h1>
  </div>
</div>

<div class="max-w-2xl">
  <div class="card">
    <div class="card-body">
      <form method="post" class="space-y-5">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label required">Asset Code</label>
            <input type="text" name="asset_code" value="{{ asset.asset_code|default:post_data.asset_code }}"
                   class="form-input" placeholder="e.g. HVAC-001" {% if asset %}readonly{% endif %} required>
          </div>
          <div class="form-group">
            <label class="form-label required">Asset Type</label>
            <input type="text" name="asset_type" value="{{ asset.asset_type|default:post_data.asset_type }}"
                   class="form-input" placeholder="e.g. HVAC, Elevator, Generator" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required">Name</label>
          <input type="text" name="name" value="{{ asset.name|default:post_data.name }}"
                 class="form-input" placeholder="Descriptive name" required>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" name="brand" value="{{ asset.brand|default:post_data.brand }}"
                   class="form-input" placeholder="Manufacturer">
          </div>
          <div class="form-group">
            <label class="form-label">Model Number</label>
            <input type="text" name="model_number" value="{{ asset.model_number|default:post_data.model_number }}"
                   class="form-input">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Serial Number</label>
            <input type="text" name="serial_number" value="{{ asset.serial_number|default:post_data.serial_number }}"
                   class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="active" {% if asset.status == 'active' or not asset %}selected{% endif %}>Active</option>
              <option value="under_maintenance" {% if asset.status == 'under_maintenance' %}selected{% endif %}>Under Maintenance</option>
              <option value="retired" {% if asset.status == 'retired' %}selected{% endif %}>Retired</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Location</label>
          <select name="location" class="form-select">
            <option value="">— No specific location —</option>
            {% for loc in locations %}
            <option value="{{ loc.pk }}" {% if asset.location_id == loc.pk %}selected{% endif %}>
              {{ loc.full_path }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="form-group">
            <label class="form-label">Purchase Date</label>
            <input type="date" name="purchase_date"
                   value="{{ asset.purchase_date|date:'Y-m-d'|default:'' }}" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Warranty Expiry</label>
            <input type="date" name="warranty_expiry"
                   value="{{ asset.warranty_expiry|date:'Y-m-d'|default:'' }}" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea name="notes" rows="3" class="form-textarea"
                    placeholder="Any additional notes about this asset…">{{ asset.notes|default:'' }}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn btn-primary">{{ action }} Asset</button>
          {% if asset %}
          <a href="{% url 'assets:detail' asset.pk %}" class="btn btn-secondary">Cancel</a>
          {% else %}
          <a href="{% url 'assets:list' %}" class="btn btn-secondary">Cancel</a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
