{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete — MaintenanceHub{% endblock %}

{% block body %}
<div class="flex min-h-screen items-center justify-center px-6 py-16" style="background-color: #f8fafc;">
  <div class="w-full max-w-sm text-center">

    <!-- Success icon -->
    <div class="flex h-16 w-16 items-center justify-center rounded-2xl mx-auto mb-6"
         style="background-color: rgba(5,150,105,0.08); border: 1px solid rgba(5,150,105,0.2);">
      <svg class="h-8 w-8" style="color: #059669;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold mb-3" style="color: #0f172a; letter-spacing: -0.025em;">Password updated!</h1>
    <p class="text-sm leading-relaxed mb-8" style="color: #64748b; max-width: 320px; margin-left: auto; margin-right: auto;">
      Your password has been successfully changed. You can now sign in with your new password.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary inline-flex w-full justify-center">
      Sign in to your account
    </a>
  </div>
</div>
{% endblock %}
