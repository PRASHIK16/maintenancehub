{% load static %}
<header class="h-14 flex items-center justify-between px-4 md:px-6 border-b border-[var(--surface-border)] bg-[var(--surface-card)] flex-shrink-0">

  {# Mobile menu button #}
  <button class="md:hidden p-2 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--color-neutral-100)] hover:text-[var(--text-primary)] transition-colors"
          onclick="openSidebar()" aria-label="Open navigation menu">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  {# Global search #}
  <div class="flex-1 max-w-lg mx-4">
    <div class="search-input"
         hx-get="{% url 'dashboard:search' %}"
         hx-trigger="input changed delay:300ms from:[name=q]"
         hx-target="#search-results"
         hx-swap="innerHTML">
      <svg class="w-4 h-4 text-[var(--text-tertiary)] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
      </svg>
      <input type="search" name="q" placeholder="Search tickets, locations, assets…"
             class="flex-1 bg-transparent border-none outline-none text-sm text-[var(--text-primary)] placeholder-[var(--text-tertiary)]"
             autocomplete="off" role="searchbox" aria-label="Search">
      <span class="hidden sm:flex items-center gap-1 text-xs text-[var(--text-tertiary)] bg-[var(--color-neutral-100)] px-1.5 py-0.5 rounded">
        <kbd>⌘</kbd><kbd>K</kbd>
      </span>
    </div>
    <div id="search-results"></div>
  </div>

  {# Right actions #}
  <div class="flex items-center gap-2">

    {# Create ticket button #}
    <a href="{% url 'dashboard:create-ticket' %}"
       class="btn btn-primary btn-sm hidden sm:inline-flex">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      <span>New Request</span>
    </a>

    {# Notifications #}
    <div class="relative" x-data="{ open: false }">
      <button class="relative p-2 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--color-neutral-100)] hover:text-[var(--text-primary)] transition-colors"
              hx-get="{% url 'notifications:panel' %}"
              hx-target="#notifications-panel"
              hx-swap="innerHTML"
              aria-label="Notifications">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        {% if unread_notifications_count %}
        <span class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-red-500 text-white text-xs font-600 rounded-full flex items-center justify-center">
          {% if unread_notifications_count > 9 %}9+{% else %}{{ unread_notifications_count }}{% endif %}
        </span>
        {% endif %}
      </button>

      {# Notification panel dropdown #}
      <div id="notifications-panel"
           class="absolute right-0 mt-2 w-96 bg-[var(--surface-card)] border border-[var(--surface-border)] rounded-xl shadow-xl z-50">
      </div>
    </div>

    {# Theme toggle #}
    <button onclick="toggleTheme()"
            class="p-2 rounded-lg text-[var(--text-secondary)] hover:bg-[var(--color-neutral-100)] hover:text-[var(--text-primary)] transition-colors"
            aria-label="Toggle dark mode">
      <svg class="w-5 h-5 dark-icon hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <svg class="w-5 h-5 light-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>

  </div>
</header>
